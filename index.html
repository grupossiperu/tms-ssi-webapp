<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Servicios - Transportes SSI S.A.C.</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="contenedor-home">

  <header class="app-header">
    <h1>SISTEMA DE SERVICIOS<br>TRANSPORTES SSI S.A.C.</h1>
  </header>

  <div id="estado-hojas" class="aviso-caja" style="display:none;"></div>

  <!-- Registrar Servicio -->
  <button class="boton-modulo" id="btn-registrar-servicio">
    <span class="icono">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1c3a5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="9" width="13" height="8"></rect>
        <path d="M14 11h4l4 4v2h-8z"></path>
        <circle cx="6" cy="19" r="2"></circle>
        <circle cx="18" cy="19" r="2"></circle>
        <path d="M3 6h8"></path>
        <path d="M3 3h5"></path>
      </svg>
    </span>
    REGISTRAR SERVICIO
  </button>

  <!-- Consolidado de Servicios + Tipo de Cambio -->
  <div class="fila-doble">
    <button class="boton-modulo" id="btn-consolidado-servicios">
      <span class="icono">
        <svg viewBox="0 0 24 24" fill="none" stroke="#1c3a5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 2l4 4-4 4"></path>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <path d="M7 22l-4-4 4-4"></path>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
      </span>
      CONSOLIDADO DE SERVICIOS
    </button>

    <button class="boton-circular" id="btn-tipo-cambio">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1c3a5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M9.5 9a2.5 2 0 0 1 5 0c0 2-2.5 2-2.5 4"></path>
        <path d="M12 16h.01"></path>
        <path d="M8 8l1.2-1.2"></path>
        <path d="M15 15l1.2 1.2"></path>
      </svg>
      TIPO DE<br>CAMBIO
    </button>
  </div>

  <!-- Sobrecostos -->
  <button class="boton-modulo" id="btn-sobrecostos">
    <span class="icono">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1c3a5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="1" x2="12" y2="23"></line>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        <path d="M18 6l3-3-3-3" transform="translate(0,3)"></path>
      </svg>
    </span>
    SOBRECOSTOS
  </button>

  <!-- Facturar -->
  <button class="boton-modulo" id="btn-facturar">
    <span class="icono">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1c3a5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path>
        <path d="M15 2v5h5"></path>
        <line x1="8" y1="13" x2="16" y2="13"></line>
        <line x1="8" y1="17" x2="13" y2="17"></line>
      </svg>
    </span>
    FACTURAR
  </button>

  <!-- Gestionar Peajes -->
  <button class="boton-modulo" id="btn-gestionar-peajes">
    <span class="icono">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1c3a5e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h18"></path>
        <path d="M3 12l4-4"></path>
        <path d="M3 12l4 4"></path>
        <path d="M21 12l-4-4"></path>
        <path d="M21 12l-4 4"></path>
        <line x1="12" y1="3" x2="12" y2="21"></line>
      </svg>
    </span>
    GESTIONAR PEAJES
  </button>

  <!-- Ver / Ocultar -->
  <div class="fila-ver-ocultar">
    <button class="boton-ver-ocultar boton-ver" id="btn-ver" title="Ver hojas de servicios">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1f9d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    </button>
    <button class="boton-ver-ocultar boton-ocultar" id="btn-ocultar" title="Ocultar hojas de servicios">
      <svg viewBox="0 0 24 24" fill="none" stroke="#d33a3a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94"></path>
        <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19"></path>
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    </button>
  </div>

</div>

<!-- Contenedor único de paneles/modales (SPA, sin recarga de página) -->
<div id="contenedor-panel"></div>

<!-- Núcleo -->
<script src="app.js"></script>

<!-- Un archivo por cada UserForm original, sin fusionar -->
<script src="forms/accesoServicios.js"></script>
<script src="forms/tipoCambio.js"></script>
<script src="forms/servicio.js"></script>
<script src="forms/selServicioContabilidad.js"></script>
<script src="forms/consolidadoServicio.js"></script>
<script src="forms/sobrecostos.js"></script>
<script src="forms/seleccionSobrecosto.js"></script>
<script src="forms/registroSobrecosto.js"></script>
<script src="forms/selFacturaViaje.js"></script>
<script src="forms/facturaViaje.js"></script>
<script src="forms/facturaSobrecosto.js"></script>
<script src="forms/facturaBalanza.js"></script>
<script src="forms/peajes.js"></script>

</body>
</html>
